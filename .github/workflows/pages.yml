name: Publish historical form archive
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check catalogue and local assets
        run: node tools/check-site.mjs
      - uses: actions/configure-pages@v5
      - name: Stage public site
        run: |
          node tools/check-lee.mjs
          mkdir _site
          cp -R lee _site/
          cp index.html .nojekyll moves.md Yang_Chengfu_Form.jpg _site/
          cp -R assets extracted poses research _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Check Lee main-form archive
on:
  pull_request:
    paths: ['lee/**', 'tools/check-lee.mjs', 'tools/catalogue/src/bin/lee_catalogue.rs', 'index.html', 'assets/traditions.css', '.github/workflows/**']
  push:
    branches: [research/lee-main-form]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --check lee/lee.js
      - name: Rebuild the Lee catalogue and check committed output
        run: |
          cargo run --locked --manifest-path tools/catalogue/Cargo.toml --bin lee_catalogue
          git diff --exit-code -- lee/
      - run: node tools/check-lee.mjs
      - run: node tools/check-site.mjs
